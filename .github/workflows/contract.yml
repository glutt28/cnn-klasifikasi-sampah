name: contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_TAG: Preview2
  MODEL_ASSET: model.pth

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm pillow numpy
          if [ -s submission/requirements.txt ]; then
            pip install -r submission/requirements.txt
          fi

      - name: Fetch model.pth from GitHub Release (if repo copy is empty)
        run: |
          if [ ! -s submission/model.pth ]; then
            url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${MODEL_ASSET}"
            echo "submission/model.pth is empty; downloading ${url}"
            curl -fL --retry 3 -o submission/model.pth "${url}"
          fi
          ls -l submission/model.pth

      - name: Run contract validation
        run: python -m scripts.validate_contract
